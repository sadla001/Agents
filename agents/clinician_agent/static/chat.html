<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinician Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f0f4f8;
           display: flex; justify-content: center; align-items: center;
           height: 100vh; }
    .chat-card { width: 720px; height: 85vh; background: white;
                 border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.12);
                 display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #1a4b8e; color: white;
                   padding: 16px 20px; }
    .chat-header h2 { font-size: 16px; font-weight: 600; }
    .chat-header p  { font-size: 12px; opacity: .8; margin-top: 4px; }
    .chat-body { flex: 1; overflow-y: auto; padding: 20px;
                 display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 10px;
           font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
    .user     { background:#1a4b8e; color:white; align-self:flex-end;
                border-bottom-right-radius: 2px; }
    .agent    { background:#f0f4f8; color:#1e293b; align-self:flex-start;
                border-bottom-left-radius: 2px; }
    .thinking { background:#fffbeb; color:#78716c; align-self:flex-start;
                font-style:italic; font-size:12px;
                border-left: 3px solid #f59e0b; }
    .system   { background:#e0f2fe; color:#0369a1; align-self:center;
                font-size:12px; border-radius:20px; }
    .card { background:white; border:1px solid #cbd5e1; border-radius:10px;
            padding:14px 18px; align-self:flex-start; max-width:90%; }
    .card h4 { font-size:14px; color:#1a4b8e; margin-bottom:10px; }
    .card .row { display:flex; justify-content:space-between;
                 font-size:13px; padding:4px 0;
                 border-bottom: 1px solid #f1f5f9; }
    .card .label { color:#64748b; font-weight:500; }
    .card .value { color:#1e293b; text-align:right; max-width:60%; }
    .alert-box { margin-top:10px; background:#fff7ed;
                 border-left:4px solid #f97316;
                 padding:8px 12px; border-radius:4px;
                 font-size:13px; color:#9a3412; }
    .ai-text { margin-top:10px; font-size:12px;
               color:#475569; font-style:italic; }
    .quick-btns { display:flex; gap:8px; padding:0 16px 12px;
                  flex-wrap:wrap; }
    .quick-btn  { padding:6px 12px; font-size:12px;
                  background:#e8edf3; border:none;
                  border-radius:20px; cursor:pointer; color:#1a4b8e; }
    .quick-btn:hover { background:#d0d8e4; }
    .chat-input { display:flex; padding:16px; gap:10px;
                  border-top:1px solid #e8edf3; }
    .chat-input input { flex:1; padding:10px 14px;
                        border:1px solid #d0d8e4; border-radius:8px;
                        font-size:14px; outline:none; }
    .chat-input input:focus { border-color:#1a4b8e; }
    .chat-input button { padding:10px 20px; background:#1a4b8e;
                         color:white; border:none; border-radius:8px;
                         cursor:pointer; font-size:14px; }
    .chat-input button:disabled { background:#b0bec5; cursor:not-allowed; }
    .patient-select { padding:16px 16px 0;
                      display:flex; align-items:center; gap:8px; }
    .patient-select label { font-size:13px; color:#64748b; }
.patient-select select { padding:6px 10px; border:1px solid #d0d8e4;
                             border-radius:6px; font-size:13px; }
  </style>
</head>
<body>
<div class="chat-card">
  <div class="chat-header">
    <h2>🩺 ONCO-2024-INT Clinician Agent</h2>
    <p id="header-sub">Intent-Aware Interoperability · Clinical Benefit Assessment</p>
  </div>
  <div class="patient-select">
    <label>Patient:</label>
    <select id="patient-select" onchange="changePatient()">
      <option value="PT-001">PT-001</option>
      <option value="PT-002">PT-002</option>
      <option value="PT-003" selected>PT-003</option>
      <option value="PT-004">PT-004</option>
      <option value="PT-005">PT-005</option>
    </select>
    <button class="quick-btn" onclick="clearSession()">Clear session</button>
  </div>
  <div class="chat-body" id="messages"></div>
  <div class="quick-btns">
    <button class="quick-btn"
      onclick="send('Assess clinical benefit')">Full assessment</button>
    <button class="quick-btn"
      onclick="send('What is the renal function trend?')">Renal</button>
    <button class="quick-btn"
      onclick="send('Summarise the tumor marker trend')">Tumor markers</button>
    <button class="quick-btn"
      onclick="send('Are there any active clinical alerts?')">Alerts</button>
  </div>
  <div class="chat-input">
    <input id="input" type="text"
           placeholder="Ask about the patient..."
           onkeydown="if(event.key==='Enter') send()" />
    <button id="send-btn" onclick="send()">Send</button>
  </div>
</div>

<script>
  let patientId = "PT-003";
  let ws        = null;
  let thinkEl   = null;
 
  // Detect whether we are running locally or on Cloud Run
  const BASE_WS = window.location.protocol === "https:"
    ? `wss://${window.location.host}`
    : `ws://${window.location.host}`;
 
  function connect() {
    if (ws) ws.close();
    ws = new WebSocket(`${BASE_WS}/chat/${patientId}`);
 
    ws.onopen = () => setBusy(false);
 
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
 
      if (data.type === "system") {
        addMsg("system", data.text);
      }
 
      if (data.type === "thinking") {
        if (!thinkEl) thinkEl = addMsg("thinking", data.text);
        else thinkEl.textContent = data.text;
      }
 
      if (data.type === "response") {
        if (thinkEl) { thinkEl.remove(); thinkEl = null; }
        setBusy(false);
        // Try to render as a Clinical Response Card
        try {
          const m = data.text.match(/\{[\s\S]*\}/);
          if (m) { renderCard(JSON.parse(m[0])); return; }
        } catch {}
        addMsg("agent", data.text);
      }
    };
 
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
 
  function send(text) {
    const input = document.getElementById("input");
    const msg   = text || input.value.trim();
    if (!msg || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMsg("user", msg);
    input.value = "";
    setBusy(true);
    ws.send(msg);
  }
 
  function renderCard(card) {
    const el  = document.createElement("div");
    el.className = "card";
    const mp  = card.main_panel || {};
    el.innerHTML = `
      <h4>📋 Clinical Response Summary — ${card.patient_id || patientId}</h4>
      <div class="row">
        <span class="label">Symptom Burden</span>
        <span class="value">${mp.symptom_burden || "—"}</span>
      </div>
      <div class="row">
        <span class="label">Tumor Markers</span>
        <span class="value">${mp.tumor_markers || "—"}</span>
      </div>
      <div class="row">
        <span class="label">Renal Function</span>
        <span class="value">${mp.renal_function || "—"}</span>
      </div>
      ${card.clinical_alert
        ? `<div class="alert-box">⚠ ${card.clinical_alert}</div>` : ""}
      ${card.ai_reasoning
        ? `<div class="ai-text">${card.ai_reasoning}</div>` : ""}
    `;
    document.getElementById("messages").appendChild(el);
    scrollBottom();
  }
 
  function addMsg(type, text) {
    const el = document.createElement("div");
    el.className = `msg ${type}`;
    el.textContent = text;
    document.getElementById("messages").appendChild(el);
    scrollBottom();
    return el;
  }
 
  function changePatient() {
    patientId = document.getElementById("patient-select").value;
    document.getElementById("messages").innerHTML = "";
    connect();
  }
 
  function clearSession() {
    fetch(`/chat/${patientId}`, { method: "DELETE" });
    document.getElementById("messages").innerHTML = "";
    connect();
  }
 
  function setBusy(busy) {
 document.getElementById("send-btn").disabled = busy;
    document.getElementById("input").disabled    = busy;
  }
 
  function scrollBottom() {
    const b = document.getElementById("messages");
    b.scrollTop = b.scrollHeight;
  }
 
  // Connect on page load
  connect();
</script>
</body>
</html>
